name: Inspect REPO valuable director

on:
  push:
    branches:
      - gpt-inspect-valuable-director

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install ILSpy command line
        run: |
          dotnet tool install --global ilspycmd
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Decompile REPO 0.5.1 valuable director
        shell: bash
        run: |
          mkdir -p diagnostics
          ilspycmd -l c Assembly-CSharp.dll | tee diagnostics/types.txt
          grep -i 'valuable' diagnostics/types.txt > diagnostics/valuable-types.txt || true
          ilspycmd -t ValuableDirector Assembly-CSharp.dll > diagnostics/ValuableDirector.cs
          ilspycmd -t 'ValuableDirector.<SetupHost>d__90' Assembly-CSharp.dll > diagnostics/SetupHostStateMachine.cs || true
          ilspycmd -t ValuableVolume Assembly-CSharp.dll > diagnostics/ValuableVolume.cs
          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Commit: $GITHUB_SHA"
            echo "Assembly: Assembly-CSharp.dll"
            sha256sum Assembly-CSharp.dll
            stat -c 'Size: %s bytes' Assembly-CSharp.dll
          } > diagnostics/build-info.txt

      - name: Inspect latest official Valuables Uncapped package
        shell: bash
        run: |
          mkdir -p modpkg diagnostics/latest-mod
          curl -fL "https://thunderstore.io/package/download/Omniscye/Valuables_Uncapped/2.1.0/" -o modpkg/latest.zip
          unzip -q modpkg/latest.zip -d modpkg/unpacked
          find modpkg/unpacked -type f -name '*.dll' -print
          DLL="$(find modpkg/unpacked -type f -name '*.dll' | head -n 1)"
          test -n "$DLL"
          ilspycmd -l c "$DLL" | tee diagnostics/latest-mod/types.txt
          while IFS= read -r line; do
            case "$line" in
              *ValuableDirectorSpawnValuablePatch*|*ValuableDirectorSetupHostPatch*)
                TYPE="${line#Class }"
                SAFE="$(echo "$TYPE" | tr -c 'A-Za-z0-9._-' '_')"
                ilspycmd -t "$TYPE" "$DLL" > "diagnostics/latest-mod/$SAFE.cs" || true
                ;;
            esac
          done < diagnostics/latest-mod/types.txt
          cp "$DLL" diagnostics/latest-mod/
          unzip -p modpkg/latest.zip manifest.json > diagnostics/latest-mod/manifest.json || true
          unzip -p modpkg/latest.zip README.md > diagnostics/latest-mod/README.md || true

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: valuable-director-inspection
          path: diagnostics/
          retention-days: 2

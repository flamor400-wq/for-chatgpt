name: Build REPO 0.5.1 Valuables Uncapped compatibility plugin

on:
  push:
    branches:
      - repair-valuable-051

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download BepInEx reference assemblies
        shell: bash
        run: |
          curl -fL "https://thunderstore.io/package/download/BepInEx/BepInExPack/5.4.2305/" -o bepInExPack.zip
          mkdir -p deps
          unzip -q bepInExPack.zip -d deps
          BEX="$(find "$GITHUB_WORKSPACE/deps" -type f -name BepInEx.dll | head -n 1)"
          test -n "$BEX"
          echo "BepInExDir=$(dirname "$(dirname "$BEX")")" >> "$GITHUB_ENV"
          echo "BepInEx assembly: $BEX"
          find deps -type f \( -name 'BepInEx.dll' -o -name '0Harmony.dll' -o -name 'UnityEngine*.dll' \) -print

      - name: Build plugin
        run: dotnet build ValuablesUncappedCompat.csproj --configuration Release --output publish

      - name: Verify plugin metadata and patched method selectors
        run: |
          dotnet tool install --global ilspycmd
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          ilspycmd -l c publish/EmpressValuablesUncapped.dll
          ilspycmd publish/EmpressValuablesUncapped.dll > publish/decompiled-check.cs
          grep -E 'SpawnValuable|SetupHost|valuableDebug|totalMaxValue|0.5.1.1' publish/decompiled-check.cs | head -50

      - name: Upload compiled plugin
        uses: actions/upload-artifact@v4
        with:
          name: EmpressValuablesUncapped-REPO-0.5.1
          path: publish/EmpressValuablesUncapped.dll
          retention-days: 7
